# action-ros-ci copies the repo into ros_ws/src/<random-id>/<pkg>/ before building,
# so coverage paths look like ros_ws/src/ab12cd/hierarchical_multiagent_langgraph/...
# Strip that prefix so Codecov maps the reports back onto the repo tree.
fixes:
  - "ros_ws/src/*/hierarchical_multiagent_langgraph/::"
  - "src/hierarchical_multiagent_langgraph/::"
  - "install/::"

ignore:
  - "*/**/test/*"
  - "*/test/**/*"
  - "**/test_*.*"
  - "**/main*.*"
  - "**/*_tests.*"
  - "*/**/benchmark/*"
  - "*/benchmark/**/*"
  - "**/benchmark_*.*"
  - "**/*_benchmark.*"
